[unstable]
json-target-spec = true #enable setting target with JSON
build-std-features = ["compiler-builtins-mem"] #implement memory-related intrinsics
build-std = ["core", "compiler_builtins"] #build core lib for target
panic-abort-tests = true #build test harness with abort panic strategy to avoid duplicate lang item bug

[build]
target = "x86_64-crsh_os.json" #automatically set target to JSON
rustflags = ["-A", "non_snake_case"] #suppress warning for non-snake case names

[target.'cfg(target_os = "none")'] #allow building and running via cargo run
runner = "bootimage runner"