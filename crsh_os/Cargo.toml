[package]
name = "crsh_os"
version = "0.1.0"
edition = "2024"
authors = ["Lily 'Appalachian' Gross (lilybethgross@gmail.com)"]

[dependencies]
bootloader = "0.9"
volatile = "0.2.6"
spin = "0.5.2"
x86_64 = "0.15.5"
uart_16550 = "0.6.0"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[[bin]]
name = "crsh_os"
test = true
bench = false

[package.metadata.bootimage]
test-args = ["-device", "isa-debug-exit,iobase=0xf4,iosize=0x04", "-serial", "stdio"] #allow easier exiting of Qemu
test-success-exit-code = 33 # (0x10 << 1) | 1, this is the successful test code for Qemu closing